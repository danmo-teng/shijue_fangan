# 2027 intelligent-rescue field: centre origin, +X right, +Y upward.
start_zone = 4
field_half_m = 1.500
start_center_m = 1.350

# Values copied from F407-Rescue-Robot/Main/Inc/app_config.h.
wheel_diameter_m = 0.070
counts_per_wheel_revolution = 1768
encoder_sign_m1 = -1
encoder_sign_m2 = -1
encoder_sign_m3 = -1
# Current wiring/kinematics decodes physical forward as +left. Rotate the
# decoded (forward,left) vector clockwise 90 degrees into the robot body axes:
# corrected_forward=raw_left, corrected_left=-raw_forward.
encoder_to_robot_yaw_deg = -90.0

# Measure wheel contact radius from chassis rotation centre. The raw wheel
# rotation result is retained in the debug log for comparison; T265 gyro yaw
# is the heading increment used by wheel odometry/EKF prediction.
wheel_center_radius_m = 0.130

# T265 tracking origin relative to the chassis rotation centre, expressed in
# robot forward/left axes (metres). These are not the 105 mm push plate offset
# or the 130 mm wheel kinematic radius.
camera_offset_forward_m = 0.0
camera_offset_left_m = 0.0
# Each vector is a robot axis expressed in T265 Pose-body coordinates.
# Lens-up T265 Pose-frame calibration. Forward=+X fixes the longitudinal
# 180-degree error. Robot up is -Z in the T265 Pose frame (the IMU sub-frame
# drawn in the extrinsics image is different), so derived robot left is -Y.
camera_robot_forward_axis = +x
camera_robot_up_axis = -z

# Three 300x60x10 mm speed bumps, separated by 50 mm, surround each start.
# Encoder prediction is disabled for the first 0.70 m and whenever the T265
# field pose is inside one of the four configured corner regions.
startup_wheel_disable_distance_m = 0.70
corner_exclusion_inner_m = 0.75
maximum_wheel_speed_mps = 1.50
maximum_velocity_residual_mps = 0.70

# During NAV/RETURN, wheel prediction carries long straight-line progress.
# T265 still corrects yaw at pose rate, but position correction is downsampled
# and weakened so SLAM_ERROR Speed cannot erase encoder travel.
navigation_t265_position_sigma_multiplier = 8.0
navigation_t265_position_correction_rate_hz = 20.0
mapper_zero_position_sigma_multiplier = 12.0

# Near the fence, wheel motion with an almost stationary T265 is treated as
# slip/contact and is not integrated into the field position.
navigation_near_target_m = 0.30
navigation_slip_wheel_speed_mps = 0.10
navigation_slip_t265_speed_mps = 0.05
uart_stale_ms = 150

# EKF wheel prediction noise.
wheel_position_sigma_floor_m = 0.002
wheel_position_sigma_per_meter = 0.04
wheel_yaw_sigma_floor_deg = 0.20
wheel_yaw_sigma_per_radian = 0.08

# T265 is deliberately the primary source. Lower confidence gives it a larger
# covariance instead of immediately discarding all measurements.
t265_position_sigma_conf3_m = 0.015
t265_position_sigma_conf2_m = 0.040
t265_position_sigma_conf1_m = 0.250
t265_yaw_sigma_conf3_deg = 1.0
t265_yaw_sigma_conf2_deg = 3.0
t265_yaw_sigma_conf1_deg = 15.0
maximum_t265_innovation_m = 0.60
